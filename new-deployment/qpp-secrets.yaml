apiVersion: v1
kind: Secret
metadata:
  name: qpp-secrets
type: Opaque
stringData:
  # PostgreSQL (used by the postgres Deployment and/or to construct DATABASE_URL)
  POSTGRES_USER: user
  POSTGRES_PASSWORD: POSTGRES123
  POSTGRES_DB: qpp

  # Backend (FastAPI)
  DATABASE_URL: postgresql://qpp:POSTGRES123@postgres:5432/qpp

  SECRET_KEY: change-me-to-a-long-random-string

  # Initial seed users (used by db-seed job)
  SEED_ADMIN_USERNAME: admin
  SEED_ADMIN_PASSWORD: admin123456
  SEED_USER_USERNAME: user
  SEED_USER_PASSWORD: user123456
