apiVersion: v1
kind: ConfigMap
metadata:
  name: qpp-config
data:
  # Qdrant
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"

  # TEI embeddings (Text Embeddings Inference)
  TEI_BASE_URL: http://tei:8080
  TEI_EMBED_PATH: /embed
  TEI_TIMEOUT_SECONDS: "30"
  TEI_TLS_VERIFY: "true"

  # LLM (already deployed in the cluster; reference only)
  VLLM_BASE_URL: https://llama-31-8b-inst-predictor.llama-model.svc.cluster.local:8443
  VLLM_BASE_URL_FALLBACK: https://llama-33-70b-inst-q8-scalovate-poc.apps.hq-ai.pp.gov.qa
  VLLM_API_PATH: /v1/chat/completions
  VLLM_MODEL: meta-llama/Llama-3.2-1B-Instruct
  VLLM_TIMEOUT_SECONDS: "60"
  VLLM_TLS_VERIFY: "true"
