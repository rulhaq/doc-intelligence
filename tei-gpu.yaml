apiVersion: apps/v1
kind: Deployment
metadata:
  name: customerllm-tei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tei
  template:
    metadata:
      labels:
        app: tei
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.8
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - intfloat/multilingual-e5-large
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HF_HOME
              value: /tmp/hf
            - name: TRANSFORMERS_CACHE
              value: /tmp/hf
          volumeMounts:
            - name: tei-cache
              mountPath: /tmp/hf
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 10
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: tei-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tei
spec:
  selector:
    app: tei
  ports:
    - name: http
      port: 8080
      targetPort: http
