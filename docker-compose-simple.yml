version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: customerllm-postgres
    environment:
      POSTGRES_DB: customerllm
      POSTGRES_USER: customerllm
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customerllm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - customerllm-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: customerllm-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - customerllm-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: customerllm-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - customerllm-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: customerllm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - customerllm-network

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  minio_data:

networks:
  customerllm-network:
    driver: bridge

