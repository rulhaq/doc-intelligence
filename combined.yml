apiVersion: v1
kind: Namespace
metadata:
  name: <NAMESPACE>
---
apiVersion: v1
kind: Secret
metadata:
  name: customerllm-secrets
  namespace: <NAMESPACE>
type: Opaque
stringData:
  DATABASE_URL: postgresql://customerllm:<POSTGRES_PASSWORD>@postgres.<NAMESPACE>.svc.cluster.local:5432/customerllm
  REDIS_URL: redis://redis.<NAMESPACE>.svc.cluster.local:6379/0
  QDRANT_URL: http://qdrant.<NAMESPACE>.svc.cluster.local:6333
  S3_ENDPOINT: http://minio.<NAMESPACE>.svc.cluster.local:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin_password
  SECRET_KEY: <SECRET_KEY>
  OCR_WORKER_URL: http://ocr-worker.<NAMESPACE>.svc.cluster.local:8001
  OLLAMA_BASE_URL: http://ollama.<NAMESPACE>.svc.cluster.local:11434
  OLLAMA_MODEL: llama3.2:1b
  OLLAMA_EMBEDDING_MODEL: nomic-embed-text:latest
  CORS_ORIGINS: https://<FRONTEND_ROUTE_HOST>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: <NAMESPACE>
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: <STORAGE_CLASS>
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: <NAMESPACE>
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: <STORAGE_CLASS>
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: <NAMESPACE>
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: <STORAGE_CLASS>
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: <NAMESPACE>
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: <STORAGE_CLASS>
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: <NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: customerllm
            - name: POSTGRES_USER
              value: customerllm
            - name: POSTGRES_PASSWORD
              value: <POSTGRES_PASSWORD>
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: <NAMESPACE>
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: <NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: <NAMESPACE>
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: <NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin_password
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: <NAMESPACE>
spec:
  selector: { app: minio }
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: <NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
            - containerPort: 6334
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: qdrant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: <NAMESPACE>
spec:
  selector: { app: qdrant }
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: <NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
          ports:
            - containerPort: 11434
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: <NAMESPACE>
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customerllm-app
  namespace: <NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels: { app: customerllm-app }
  template:
    metadata:
      labels: { app: customerllm-app }
    spec:
      containers:
        - name: customerllm-app
          image: <DOCKERHUB_USER>/customerllm-app:v1
          ports:
            - containerPort: 80
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: customerllm-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: customerllm-app
  namespace: <NAMESPACE>
spec:
  selector: { app: customerllm-app }
  ports:
    - name: frontend
      port: 80
      targetPort: 80
    - name: backend
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker
  namespace: <NAMESPACE>
spec:
  replicas: 1
  selector:
    matchLabels: { app: ocr-worker }
  template:
    metadata:
      labels: { app: ocr-worker }
    spec:
      containers:
        - name: ocr-worker
          image: <DOCKERHUB_USER>/customerllm-ocr-worker:v1
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: customerllm-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-worker
  namespace: <NAMESPACE>
spec:
  selector: { app: ocr-worker }
  ports:
    - port: 8001
      targetPort: 8001
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: customerllm-frontend
  namespace: <NAMESPACE>
spec:
  host: <FRONTEND_ROUTE_HOST>
  to:
    kind: Service
    name: customerllm-app
  port:
    targetPort: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: customerllm-backend
  namespace: <NAMESPACE>
spec:
  host: <BACKEND_ROUTE_HOST>
  to:
    kind: Service
    name: customerllm-app
  port:
    targetPort: 8000
