services:
  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - qpp-backend

  qpp-backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - TEI_BASE_URL=http://tei:8080
      - TEI_EMBED_PATH=/embed
      - VLLM_BASE_URL=http://vllm:8000
      - DATABASE_URL=postgresql://user:password@postgres:5432/qpp
    depends_on:
      - qdrant
      - tei
      - vllm
      - postgres
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=qpp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    ports:
      - "8082:8080"
    command: ["--model-id", "intfloat/multilingual-e5-base", "--port", "8080"]

  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8001:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    command: --model meta-llama/Llama-3.2-1B-Instruct --device cpu # Use --device cuda for GPU
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

volumes:
  qdrant_storage:
  postgres_data:
