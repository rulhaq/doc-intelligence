services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: customerllm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customerllm}
      POSTGRES_USER: ${POSTGRES_USER:-customerllm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-customerllm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - customerllm-network

  # Redis (Task Queue & Cache)
  redis:
    image: redis:7-alpine
    container_name: customerllm-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - customerllm-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: customerllm-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - customerllm-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: customerllm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - customerllm-network

  # Ollama (Local LLM Inference - MVP)
  ollama:
    image: ollama/ollama:latest
    container_name: customerllm-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - customerllm-network

  # OCR Worker (PaddleOCR + LayoutParser)
  ocr-worker:
    build:
      context: ./ocr-worker
      dockerfile: Dockerfile
    container_name: customerllm-ocr-worker
    environment:
      - PADDLEOCR_LANG=${PADDLEOCR_LANG:-en,ar}
      - PADDLEOCR_USE_GPU=${PADDLEOCR_USE_GPU:-false}
      - OCR_CONFIDENCE_THRESHOLD=${OCR_CONFIDENCE_THRESHOLD:-0.5}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-jais:7b}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./ocr-worker:/app
      - ocr_temp:/tmp/ocr
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - customerllm-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: customerllm-backend
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - QDRANT_URL=${QDRANT_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - OCR_WORKER_URL=${OCR_WORKER_URL}
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=50
      - MAX_UPLOAD_SIZE_MB=50
      - ALLOWED_EXTENSIONS=pdf,docx,txt
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - logs:/var/log/customerllm
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - customerllm-network

  # Celery Worker (Async Tasks)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: customerllm-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - QDRANT_URL=${QDRANT_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - OCR_WORKER_URL=${OCR_WORKER_URL}
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - customerllm-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    container_name: customerllm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - customerllm-network

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: customerllm-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    networks:
      - customerllm-network

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: customerllm-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - customerllm-network

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  minio_data:
  ollama_models:
  ocr_temp:
  uploads:
  logs:
  prometheus_data:
  grafana_data:

networks:
  customerllm-network:
    driver: bridge
