global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'customerllm'
    environment: 'production'

scrape_configs:
  # FastAPI Backend
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Qdrant
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'

  # OCR Worker
  - job_name: 'ocr-worker'
    static_configs:
      - targets: ['ocr-worker:8001']
    metrics_path: '/metrics'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

