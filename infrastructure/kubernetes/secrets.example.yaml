# This is an example secrets file
# Create actual secrets using: kubectl create secret generic customerllm-secrets ...
# or use a secrets management solution like External Secrets Operator

apiVersion: v1
kind: Secret
metadata:
  name: customerllm-secrets
  namespace: customerllm
type: Opaque
stringData:
  # PostgreSQL
  postgres-db: "customerllm"
  postgres-user: "customerllm"
  postgres-password: "CHANGE_ME"
  database-url: "postgresql://customerllm:CHANGE_ME@postgres:5432/customerllm"
  
  # Redis
  redis-url: "redis://redis:6379/0"
  
  # Application
  secret-key: "CHANGE_ME_GENERATE_SECURE_KEY_32_CHARS_MIN"
  
  # OAuth (if enabled)
  oauth-azure-client-id: ""
  oauth-azure-client-secret: ""
  oauth-google-client-id: ""
  oauth-google-client-secret: ""
  
  # S3/MinIO
  s3-access-key: "minioadmin"
  s3-secret-key: "CHANGE_ME"

