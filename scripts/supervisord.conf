[supervisord]
nodaemon=true

[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/customerllm/backend.out.log
stderr_logfile=/var/log/customerllm/backend.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/customerllm/nginx.out.log
stderr_logfile=/var/log/customerllm/nginx.err.log
