apiVersion: apps/v1
kind: Deployment
metadata:
  name: customerllm-frontend
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"customerllm-frontend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"frontend\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customerllm-frontend
  template:
    metadata:
      labels:
        app: customerllm-frontend
    spec:
      containers:
        - name: frontend
          image: customerllm-frontend:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: customerllm-env
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: customerllm-frontend
spec:
  selector:
    app: customerllm-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: customerllm-frontend
spec:
  to:
    kind: Service
    name: customerllm-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
