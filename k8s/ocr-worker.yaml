apiVersion: apps/v1
kind: Deployment
metadata:
  name: customerllm-ocr-worker
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"customerllm-ocr-worker:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"ocr-worker\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customerllm-ocr-worker
  template:
    metadata:
      labels:
        app: customerllm-ocr-worker
    spec:
      securityContext:
        fsGroup: 1000890000
        fsGroupChangePolicy: Always
      containers:
        - name: ocr-worker
          image: customerllm-ocr-worker:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: customerllm-env
          env:
            # PaddleOCR caches models under ~/.paddleocr; OpenShift runs with random UIDs
            # and can't write to /.paddleocr, so point HOME to a writable path.
            - name: HOME
              value: /data
            - name: XDG_CACHE_HOME
              value: /data/.cache
          ports:
            - name: http
              containerPort: 8001
          volumeMounts:
            - name: customerllm-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: customerllm-data
          persistentVolumeClaim:
            claimName: customerllm-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: customerllm-ocr-worker
spec:
  selector:
    app: customerllm-ocr-worker
  ports:
    - name: http
      port: 80
      targetPort: http
