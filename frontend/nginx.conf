server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://qpp-backend/api/;
  }

  # Optional: expose backend health/docs through the same Route (handy on OpenShift)
  location = /health {
    proxy_pass http://qpp-backend/health;
  }

  location = /openapi.json {
    proxy_pass http://qpp-backend/openapi.json;
  }

  location /docs {
    proxy_pass http://qpp-backend/docs;
  }
}
