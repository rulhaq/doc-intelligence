apiVersion: apps/v1
kind: Deployment
metadata:
  name: customerllm-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customerllm-frontend
  template:
    metadata:
      labels:
        app: customerllm-frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/karim-itani-dev/customerllm-frontend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: customerllm-env
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: customerllm-frontend
spec:
  selector:
    app: customerllm-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
